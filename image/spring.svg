<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Весна: цветущее дерево, молодая трава, ручей -->
  <defs>
    <linearGradient id="spring-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbf0"/>
      <stop offset="1" stop-color="#e6f5fb"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#spring-sky)"/>
  <circle cx="80" cy="70" r="34" fill="#ffe27a"/>
  <!-- облако -->
  <g fill="#ffffff">
    <ellipse cx="330" cy="70" rx="46" ry="18"/>
    <ellipse cx="300" cy="62" rx="26" ry="18"/>
    <ellipse cx="356" cy="58" rx="24" ry="16"/>
  </g>
  <!-- холмы -->
  <path d="M0 200 Q140 150 260 195 T480 180 V320 H0 Z" fill="#9fd47f"/>
  <path d="M0 240 Q180 205 330 235 T480 230 V320 H0 Z" fill="#7cc35e"/>
  <!-- ручей -->
  <path d="M480 250 Q380 262 330 280 T200 320 H250 Q300 296 350 286 T480 270 Z" fill="#6fb6e8"/>
  <!-- дерево в цвету -->
  <rect x="150" y="160" width="14" height="80" fill="#7a5233"/>
  <path d="M157 190 l-26 -22 M157 180 l24 -20" stroke="#7a5233" stroke-width="6" stroke-linecap="round"/>
  <g fill="#f7b6cf">
    <circle cx="157" cy="130" r="40"/>
    <circle cx="122" cy="150" r="28"/>
    <circle cx="194" cy="148" r="28"/>
    <circle cx="140" cy="112" r="24"/>
    <circle cx="178" cy="110" r="24"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="140" cy="128" r="4"/><circle cx="170" cy="140" r="4"/><circle cx="125" cy="150" r="3.5"/>
    <circle cx="190" cy="120" r="3.5"/><circle cx="160" cy="105" r="3"/><circle cx="200" cy="152" r="3"/>
  </g>
  <!-- цветы в траве -->
  <g>
    <circle cx="60" cy="262" r="5" fill="#ffffff"/><circle cx="60" cy="262" r="2" fill="#ffd34d"/>
    <circle cx="96" cy="282" r="5" fill="#ffd34d"/>
    <circle cx="230" cy="250" r="5" fill="#ffffff"/><circle cx="230" cy="250" r="2" fill="#ffd34d"/>
    <circle cx="270" cy="268" r="5" fill="#b78cf0"/>
    <circle cx="40" cy="300" r="5" fill="#b78cf0"/>
    <circle cx="140" cy="300" r="5" fill="#ffffff"/><circle cx="140" cy="300" r="2" fill="#ffd34d"/>
  </g>
  <!-- птицы -->
  <g fill="none" stroke="#3a4a63" stroke-width="2.5" stroke-linecap="round">
    <path d="M250 110 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M290 140 q6 -6 12 0 q6 -6 12 0"/>
  </g>
</svg>
