<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Лето: яркое солнце, пшеничное поле, раскидистое дерево -->
  <defs>
    <linearGradient id="summer-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9be6"/>
      <stop offset="1" stop-color="#bfe3fb"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#summer-sky)"/>
  <!-- солнце с лучами -->
  <g transform="translate(400 70)">
    <g stroke="#ffd34d" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-40"/><line x1="0" y1="40" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="-40" y2="0"/><line x1="40" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="-28" y2="-28"/><line x1="28" y1="28" x2="37" y2="37"/>
      <line x1="-37" y1="37" x2="-28" y2="28"/><line x1="28" y1="-28" x2="37" y2="-37"/>
    </g>
    <circle r="32" fill="#ffd34d"/>
  </g>
  <!-- дальний лес -->
  <path d="M0 185 Q30 165 60 180 Q90 160 120 178 Q150 162 180 180 Q210 166 240 182 Q270 168 300 184 Q330 170 360 186 Q390 172 420 186 Q450 174 480 184 V200 H0 Z" fill="#3d8a4c"/>
  <!-- поле -->
  <rect y="196" width="480" height="124" fill="#e7c55b"/>
  <g stroke="#cfa63a" stroke-width="3">
    <path d="M0 230 Q240 214 480 230" fill="none"/>
    <path d="M0 262 Q240 244 480 262" fill="none"/>
    <path d="M0 296 Q240 276 480 296" fill="none"/>
  </g>
  <!-- дерево -->
  <rect x="104" y="150" width="16" height="70" fill="#6b4a2f"/>
  <g fill="#2f8f46">
    <circle cx="112" cy="122" r="46"/>
    <circle cx="74" cy="142" r="30"/>
    <circle cx="150" cy="142" r="30"/>
  </g>
  <g fill="#3fa956">
    <circle cx="100" cy="110" r="18"/>
    <circle cx="132" cy="128" r="14"/>
  </g>
  <ellipse cx="112" cy="222" rx="60" ry="8" fill="#b8962f" opacity="0.6"/>
  <!-- облака -->
  <g fill="#ffffff">
    <ellipse cx="230" cy="60" rx="40" ry="14"/>
    <ellipse cx="208" cy="52" rx="22" ry="14"/>
    <ellipse cx="252" cy="50" rx="20" ry="12"/>
  </g>
  <!-- васильки -->
  <g fill="#3d6fd6">
    <circle cx="300" cy="250" r="5"/><circle cx="340" cy="282" r="5"/><circle cx="420" cy="240" r="5"/>
    <circle cx="200" cy="290" r="5"/><circle cx="60" cy="300" r="5"/>
  </g>
</svg>
