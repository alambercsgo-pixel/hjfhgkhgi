<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Зима: заснеженные холмы, ели и снеговик -->
  <defs>
    <linearGradient id="winter-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3ea"/>
      <stop offset="1" stop-color="#e3eefa"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#winter-sky)"/>
  <!-- бледное зимнее солнце -->
  <circle cx="390" cy="70" r="30" fill="#fff6d8" opacity="0.9"/>
  <!-- холмы -->
  <path d="M0 210 Q120 160 240 200 T480 190 V320 H0 Z" fill="#f4f8fd"/>
  <path d="M0 250 Q160 210 300 245 T480 240 V320 H0 Z" fill="#ffffff"/>
  <!-- ели: тёмные ярусы и снег на ветках -->
  <g>
    <polygon points="70,120 40,190 100,190" fill="#2f5d46"/>
    <polygon points="70,150 30,225 110,225" fill="#2f5d46"/>
    <rect x="64" y="225" width="12" height="18" fill="#6b4a2f"/>
    <polygon points="70,120 58,148 82,148" fill="#ffffff"/>
    <polygon points="50,190 40,190 46,178" fill="#ffffff"/>
    <polygon points="90,190 100,190 94,178" fill="#ffffff"/>
  </g>
  <g>
    <polygon points="140,140 115,200 165,200" fill="#3a6b52"/>
    <polygon points="140,165 108,228 172,228" fill="#3a6b52"/>
    <rect x="135" y="228" width="10" height="14" fill="#6b4a2f"/>
    <polygon points="140,140 130,163 150,163" fill="#ffffff"/>
  </g>
  <!-- снеговик -->
  <g>
    <circle cx="330" cy="248" r="30" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <circle cx="330" cy="200" r="21" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <circle cx="330" cy="166" r="15" fill="#ffffff" stroke="#c9d8ea" stroke-width="2"/>
    <rect x="318" y="140" width="24" height="12" fill="#3a3f4a"/>
    <rect x="313" y="150" width="34" height="5" fill="#3a3f4a"/>
    <circle cx="325" cy="163" r="2" fill="#2a2f38"/>
    <circle cx="335" cy="163" r="2" fill="#2a2f38"/>
    <polygon points="330,168 346,172 330,173" fill="#f07c22"/>
    <path d="M314 184 q16 8 32 0 l-2 8 q-14 6 -28 0 z" fill="#c8203a"/>
    <line x1="309" y1="198" x2="280" y2="182" stroke="#6b4a2f" stroke-width="3"/>
    <line x1="351" y1="198" x2="380" y2="180" stroke="#6b4a2f" stroke-width="3"/>
  </g>
  <!-- снежинки -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="3"/><circle cx="110" cy="70" r="2.5"/><circle cx="180" cy="30" r="3"/>
    <circle cx="230" cy="90" r="2"/><circle cx="290" cy="50" r="3"/><circle cx="440" cy="130" r="2.5"/>
    <circle cx="200" cy="140" r="2.5"/><circle cx="420" cy="30" r="2"/><circle cx="20" cy="120" r="2"/>
  </g>
</svg>
