<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 440" width="625" height="440" font-family="Arial, sans-serif">
  <!-- Учебный шаблон страницы данных загранпаспорта.
       Нарисован для контрольной работы: без герба, кода страны, номера,
       машиночитаемой зоны и защитных элементов, с пометкой «учебный макет · не документ».
       Подписи полей — на двух языках, как в загранпаспорте. Данные накладывает DOM.html. -->
  <defs>
    <pattern id="zg-waves" width="50" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q12.5 0 25 6 T50 6" fill="none" stroke="#c7dfe4" stroke-width="1"/>
    </pattern>
    <linearGradient id="zg-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6f86"/>
      <stop offset="1" stop-color="#4f97a8"/>
    </linearGradient>
  </defs>

  <!-- Фон страницы -->
  <rect width="625" height="440" rx="14" fill="#e8f3f5"/>
  <rect width="625" height="440" rx="14" fill="url(#zg-waves)"/>
  <g fill="none" stroke="#cfe5e9" stroke-width="1.2">
    <circle cx="430" cy="230" r="70"/><circle cx="430" cy="230" r="110"/><circle cx="430" cy="230" r="150"/>
  </g>
  <rect x="1" y="1" width="623" height="438" rx="14" fill="none" stroke="#9cc4cd" stroke-width="2"/>

  <!-- Верхняя полоса с названием -->
  <rect x="1" y="1" width="623" height="44" rx="14" fill="url(#zg-band)"/>
  <rect x="1" y="30" width="623" height="15" fill="url(#zg-band)"/>
  <text x="312" y="22" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#ffffff">УЧЕБНЫЙ МАКЕТ ЗАГРАНПАСПОРТА</text>
  <text x="312" y="38" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#dff1f5">TRAINING MOCK-UP · НЕ ДОКУМЕНТ · NOT A DOCUMENT</text>

  <!-- Рамка для фотографии (саму фотографию накладывает DOM.html) -->
  <rect x="30" y="68" width="150" height="200" fill="#ffffff" stroke="#6fa3b1" stroke-width="1.5"/>

  <!-- Подписи полей: по-русски / по-английски -->
  <g font-size="10" fill="#2f5d6b">
    <text x="205" y="80"><tspan font-weight="bold">Фамилия</tspan> / Surname</text>
    <text x="205" y="125"><tspan font-weight="bold">Имя</tspan> / Given names</text>
    <text x="205" y="170"><tspan font-weight="bold">Пол</tspan> / Sex</text>
    <text x="330" y="170"><tspan font-weight="bold">Дата рождения</tspan> / Date of birth</text>
    <text x="205" y="215"><tspan font-weight="bold">Место рождения</tspan> / Place of birth</text>
    <text x="205" y="260"><tspan font-weight="bold">Дата выдачи</tspan> / Date of issue</text>
    <text x="205" y="305"><tspan font-weight="bold">Орган, выдавший документ</tspan> / Authority</text>
  </g>

  <!-- Подпись владельца -->
  <line x1="30" y1="330" x2="180" y2="330" stroke="#6fa3b1" stroke-width="1"/>
  <text x="30" y="344" font-size="9" fill="#2f5d6b">Подпись владельца / Holder's signature</text>

  <!-- Нижняя полоса: в настоящем паспорте здесь машиночитаемая зона, в учебном макете она пустая -->
  <rect x="20" y="365" width="585" height="55" rx="6" fill="#ffffff" fill-opacity="0.55" stroke="#b5d3da"/>
  <text x="312" y="398" text-anchor="middle" font-size="11" fill="#5b8794">Машиночитаемая зона в учебном макете не заполняется</text>

  <!-- Водяной знак -->
  <text x="330" y="260" text-anchor="middle" font-size="28" font-weight="bold" letter-spacing="2"
        fill="#c62828" fill-opacity="0.12" transform="rotate(-14 330 260)">УЧЕБНЫЙ МАКЕТ · НЕ ДОКУМЕНТ</text>
</svg>
